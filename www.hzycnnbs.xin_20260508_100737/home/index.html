<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网站</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="index.css">
    <script type="module">
        import { loadConfig, loadPageContent, initNavbarScroll, initDarkMode, initPageLoader, initScrollReveal, addAnimation } from '../js/utils.js';
        
        // 初始化页面加载动画
        initPageLoader();
        
        // 页面加载时执行
        window.addEventListener('load', function() {
            loadConfig();
            loadPageContent('index');
            initNavbarScroll();
            initDarkMode();
            initScrollReveal();
            
            // 添加首页动画
            addAnimation('.hero h1', 'fade-in', 100);
            addAnimation('.hero p', 'fade-in', 200);
            addAnimation('.hero-buttons', 'fade-in', 300);
            addAnimation('.feature-card', 'scale-in', 400);
        });
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="../about/about.html">关于我</a></li>
                <li><a href="../projects/projects.html">我的项目</a></li>
                <li><a href="../contact/contact.html">联系方式</a></li>
                <li><a href="../login/login.html">登录</a></li>
            </ul>
        </nav>
    </header>
    
    <section id="home">
        <div class="hero-bg"></div>
        <div class="hero">
            <h1 id="hero-title">你好，我是 <span>开发者</span></h1>
            <p id="hero-description">专注于前端开发和设计，创造美观、响应式的网站</p>
            <div class="hero-buttons">
                <a href="../about/about.html" class="hero-btn hero-btn-primary">了解更多</a>
                <a href="../projects/projects.html" class="hero-btn hero-btn-secondary">查看项目</a>
            </div>
        </div>
    </section>
    
    <section class="features">
        <div class="features-container">
            <h2>我的专长</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon" style="background: transparent; color: #667eea;">
                        <img src="../images/frontend-icon.png" alt="前端开发" style="width: 40px; height: 40px; display: block;">
                    </div>
                    <h3>前端开发</h3>
                    <p>使用HTML、CSS、JavaScript等技术栈，创建美观、响应式的网站界面，确保良好的用户体验。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon" style="background: transparent; color: #667eea;">
                        <img src="../images/design-icon.png" alt="UI/UX设计" style="width: 40px; height: 40px; display: block;">
                    </div>
                    <h3>UI/UX设计</h3>
                    <p>注重用户体验和视觉美感，设计直观、易用的界面，提升用户满意度。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon" style="background: transparent; color: #667eea;">
                        <img src="../images/fullstack-icon.png" alt="全栈开发" style="width: 40px; height: 40px; display: block;">
                    </div>
                    <h3>全栈开发</h3>
                    <p>掌握前后端技术，能够独立完成完整的 web 应用开发，从前端界面到后端服务。</p>
                </div>
            </div>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2026 个人网站. 保留所有权利.</p>
    </footer>
    <script src="../js/analytics.js"></script>
</body>
</html>
