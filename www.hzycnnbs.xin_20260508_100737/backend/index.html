<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网站</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 首页的额外样式 */
        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .hero {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 0 20px;
        }
        
        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out;
        }
        
        .hero h1 span {
            color: #ffd700;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        
        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        
        .hero-btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .hero-btn-primary {
            background: white;
            color: #667eea;
        }
        
        .hero-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.3);
        }
        
        .hero-btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        
        .hero-btn-secondary:hover {
            background: white;
            color: #667eea;
            transform: translateY(-3px);
        }
        
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1;
        }
        
        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDYwIDYwIj48cGF0aCBkPSJNMzAgMzBjMCAxNi41NjktMTMuNDMxIDMwLTMwIDMweiIvPjxwYXRoIGQ9Ik0zMCAzMGMwLTE2LjU2OSAxMy40MzEtMzAgMzAtMzB6IiBmaWxsPSIjZmZmZmZmMTAiLz48L3N2Zz4=') repeat;
            opacity: 0.1;
            z-index: -1;
        }
        
        .features {
            padding: 6rem 2rem;
            background: white;
        }
        
        .features-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .features h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #333;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .feature-card {
            background: #f9f9f9;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        .feature-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: white;
        }
        
        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .feature-card p {
            color: #666;
            line-height: 1.6;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .hero p {
                font-size: 1.2rem;
            }
            
            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .hero-btn {
                width: 200px;
                text-align: center;
            }
        }
    </style>
    <script>
        // 加载配置
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('siteConfig')) || {
                siteTitle: '个人网站',
                siteDescription: '这是一个个人网站',
                menuItems: [
                    { name: '首页', url: 'index.html' },
                    { name: '关于我', url: 'about.html' },
                    { name: '我的项目', url: 'projects.html' },
                    { name: '联系方式', url: 'contact.html' }
                ],
                themeColor: '#4facfe'
            };
            
            // 更新页面标题
            document.title = config.siteTitle;
            
            // 生成导航菜单
            const navUl = document.querySelector('nav ul');
            navUl.innerHTML = '';
            
            config.menuItems.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = item.url;
                a.textContent = item.name;
                li.appendChild(a);
                navUl.appendChild(li);
            });
            
            // 检查登录状态，只对登录用户显示管理链接
            if (localStorage.getItem('userLoggedIn') === 'true') {
                const adminLi = document.createElement('li');
                const adminA = document.createElement('a');
                adminA.href = 'admin.html';
                adminA.textContent = '管理';
                adminLi.appendChild(adminA);
                navUl.appendChild(adminLi);
            } else {
                // 未登录用户显示登录链接
                const loginLi = document.createElement('li');
                const loginA = document.createElement('a');
                loginA.href = 'login.html';
                loginA.textContent = '登录';
                loginLi.appendChild(loginA);
                navUl.appendChild(loginLi);
            }
        }
        
        // 加载页面内容
        function loadPageContent() {
            const config = JSON.parse(localStorage.getItem('siteConfig')) || {
                pages: {
                    index: {
                        title: '你好，我是 <span>开发者</span>',
                        content: '专注于前端开发和设计，创造美观、响应式的网站'
                    }
                }
            };
            
            const page = config.pages.index || {
                title: '你好，我是 <span>开发者</span>',
                content: '专注于前端开发和设计，创造美观、响应式的网站'
            };
            
            document.getElementById('hero-title').innerHTML = page.title;
            document.getElementById('hero-description').textContent = page.content;
        }
        
        // 页面加载时执行
        window.addEventListener('load', function() {
            loadConfig();
            loadPageContent();
        });
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <!-- 导航链接将通过JavaScript动态生成 -->
            </ul>
        </nav>
    </header>
    
    <section id="home">
        <div class="hero-bg"></div>
        <div class="hero">
            <h1 id="hero-title">你好，我是 <span>开发者</span></h1>
            <p id="hero-description">专注于前端开发和设计，创造美观、响应式的网站</p>
            <div class="hero-buttons">
                <a href="about.html" class="hero-btn hero-btn-primary">了解更多</a>
                <a href="projects.html" class="hero-btn hero-btn-secondary">查看项目</a>
            </div>
        </div>
    </section>
    
    <section class="features">
        <div class="features-container">
            <h2>我的专长</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon">💻</div>
                    <h3>前端开发</h3>
                    <p>使用HTML、CSS、JavaScript等技术栈，创建美观、响应式的网站界面，确保良好的用户体验。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🎨</div>
                    <h3>UI/UX设计</h3>
                    <p>注重用户体验和视觉美感，设计直观、易用的界面，提升用户满意度。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">⚙️</div>
                    <h3>全栈开发</h3>
                    <p>掌握前后端技术，能够独立完成完整的 web 应用开发，从前端界面到后端服务。</p>
                </div>
            </div>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2026 个人网站. 保留所有权利.</p>
    </footer>
    <script src="analytics.js"></script>
</body>
</html>
