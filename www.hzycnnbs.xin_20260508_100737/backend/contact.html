<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系方式</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 联系方式页面的额外样式 */
        #contact {
            padding-top: 80px;
            min-height: 100vh;
        }
        
        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }
        
        .contact-info {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .contact-info h3 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #333;
        }
        
        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }
        
        .contact-item-icon {
            background: #667eea;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }
        
        .contact-item-content h4 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .contact-item-content p {
            color: #666;
            margin: 0;
        }
        
        .contact-form {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .contact-form h3 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .submit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .submit-btn:hover {
            background: #5a6fe0;
            transform: translateY(-2px);
        }
        
        .social-links {
            margin-top: 2rem;
        }
        
        .social-links h4 {
            margin-bottom: 1rem;
            color: #333;
        }
        
        .social-icons {
            display: flex;
            gap: 1rem;
        }
        
        .social-icon {
            background: #f0f0f0;
            color: #666;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .contact-info,
            .contact-form {
                padding: 2rem;
            }
        }
    </style>
    <script>
        // 加载配置
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('siteConfig')) || {
                siteTitle: '个人网站',
                menuItems: [
                    { name: '首页', url: 'index.html' },
                    { name: '关于我', url: 'about.html' },
                    { name: '我的项目', url: 'projects.html' },
                    { name: '联系方式', url: 'contact.html' }
                ],
                themeColor: '#4facfe',
                contact: {
                    email: '',
                    phone: '',
                    wechat: ''
                }
            };
            
            // 更新页面标题
            document.title = `联系方式 - ${config.siteTitle}`;
            
            // 生成导航菜单
            const navUl = document.querySelector('nav ul');
            navUl.innerHTML = '';
            
            config.menuItems.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = item.url;
                a.textContent = item.name;
                li.appendChild(a);
                navUl.appendChild(li);
            });
            
            // 检查登录状态，只对登录用户显示管理链接
            if (localStorage.getItem('userLoggedIn') === 'true') {
                const adminLi = document.createElement('li');
                const adminA = document.createElement('a');
                adminA.href = 'admin.html';
                adminA.textContent = '管理';
                adminLi.appendChild(adminA);
                navUl.appendChild(adminLi);
            } else {
                // 未登录用户显示登录链接
                const loginLi = document.createElement('li');
                const loginA = document.createElement('a');
                loginA.href = 'login.html';
                loginA.textContent = '登录';
                loginLi.appendChild(loginA);
                navUl.appendChild(loginLi);
            }
            
            // 更新联系信息
            if (config.contact.email) {
                document.querySelector('.contact-email').textContent = config.contact.email;
            }
            if (config.contact.phone) {
                document.querySelector('.contact-phone').textContent = config.contact.phone;
            }
            if (config.contact.wechat) {
                document.querySelector('.contact-wechat').textContent = config.contact.wechat;
            }
        }
        
        // 表单提交处理
        function handleSubmit(e) {
            e.preventDefault();
            
            // 获取表单数据
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            // 简单验证
            if (!name || !email || !message) {
                alert('请填写所有必填字段');
                return;
            }
            
            // 模拟表单提交
            alert('留言已发送，我们会尽快回复您！');
            document.getElementById('contact-form').reset();
        }
        
        // 加载页面内容
        function loadPageContent() {
            const config = JSON.parse(localStorage.getItem('siteConfig')) || {
                pages: {
                    contact: {
                        title: '联系信息',
                        content: ''
                    }
                }
            };
            
            const page = config.pages.contact || {
                title: '联系信息',
                content: ''
            };
            
            document.getElementById('contact-title').textContent = page.title;
        }
        
        // 页面加载时执行
        window.addEventListener('load', function() {
            loadConfig();
            loadPageContent();
            
            // 添加表单提交事件
            document.getElementById('contact-form').addEventListener('submit', handleSubmit);
        });
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <!-- 导航链接将通过JavaScript动态生成 -->
            </ul>
        </nav>
    </header>
    
    <section id="contact">
        <div class="contact-container">
            <div class="contact-info">
                <h3 id="contact-title">联系信息</h3>
                
                <div class="contact-item">
                    <div class="contact-item-icon">📧</div>
                    <div class="contact-item-content">
                        <h4>邮箱</h4>
                        <p class="contact-email">example@example.com</p>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-item-icon">📱</div>
                    <div class="contact-item-content">
                        <h4>电话</h4>
                        <p class="contact-phone">+86 123 4567 8910</p>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-item-icon">💬</div>
                    <div class="contact-item-content">
                        <h4>微信</h4>
                        <p class="contact-wechat">wechat_id</p>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-item-icon">📍</div>
                    <div class="contact-item-content">
                        <h4>地址</h4>
                        <p>北京市朝阳区某某大厦</p>
                    </div>
                </div>
                
                <div class="social-links">
                    <h4>社交媒体</h4>
                    <div class="social-icons">
                        <a href="#" class="social-icon">🔗</a>
                        <a href="#" class="social-icon">📘</a>
                        <a href="#" class="social-icon">🐦</a>
                        <a href="#" class="social-icon">📷</a>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <h3>发送留言</h3>
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">留言内容</label>
                        <textarea id="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">发送留言</button>
                </form>
            </div>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2026 个人网站. 保留所有权利.</p>
    </footer>
    <script src="analytics.js"></script>
</body>
</html>
