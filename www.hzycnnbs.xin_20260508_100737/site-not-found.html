<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站不存在</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .container {
            max-width: 800px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 1;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-size: 100px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glitch 2s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        
        h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .astronaut {
            width: 150px;
            height: 150px;
            margin: 30px auto;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .astronaut-helmet {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .astronaut-visor {
            width: 70px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .astronaut-body {
            width: 80px;
            height: 60px;
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            margin: 10px auto;
            border-radius: 40px 40px 20px 20px;
            position: relative;
        }
        
        .astronaut-arm {
            width: 20px;
            height: 40px;
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            position: absolute;
            top: 10px;
            border-radius: 10px;
            animation: wave 3s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(30deg); }
        }
        
        .astronaut-arm.left {
            left: -10px;
        }
        
        .astronaut-arm.right {
            right: -10px;
            animation-delay: 1.5s;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: white;
            color: #ff6b6b;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        
        .btn-secondary:hover {
            background: white;
            color: #ff6b6b;
            transform: translateY(-3px);
        }
        
        .asteroid {
            position: fixed;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: asteroidFly 10s linear infinite;
            pointer-events: none;
        }
        
        @keyframes asteroidFly {
            0% {
                transform: translateX(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px;
            }
            
            h1 {
                font-size: 80px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
            
            .astronaut {
                width: 120px;
                height: 120px;
            }
            
            .astronaut-helmet {
                width: 80px;
                height: 80px;
            }
            
            .astronaut-visor {
                width: 56px;
                height: 32px;
                top: 24px;
            }
            
            .astronaut-body {
                width: 64px;
                height: 48px;
            }
            
            .astronaut-arm {
                width: 16px;
                height: 32px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <h1>404</h1>
        <div class="astronaut">
            <div class="astronaut-helmet">
                <div class="astronaut-visor"></div>
            </div>
            <div class="astronaut-body">
                <div class="astronaut-arm left"></div>
                <div class="astronaut-arm right"></div>
            </div>
        </div>
        <h2>网站不存在！</h2>
        <p>看起来你访问的网站在宇宙中迷失了方向。我们的宇航员正在太空深处寻找它，但目前还没有找到。</p>
        <div class="buttons">
            <a href="index.html" class="btn btn-primary">返回地球</a>
            <a href="#" class="btn btn-secondary">探索新星系</a>
        </div>
    </div>
    
    <script>
        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // 创建小行星
        function createAsteroid() {
            const asteroid = document.createElement('div');
            asteroid.classList.add('asteroid');
            const size = Math.random() * 30 + 10;
            asteroid.style.width = size + 'px';
            asteroid.style.height = size + 'px';
            asteroid.style.top = Math.random() * 80 + 10 + '%';
            asteroid.style.animationDuration = (Math.random() * 5 + 5) + 's';
            asteroid.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(asteroid);
            
            setTimeout(() => {
                asteroid.remove();
            }, 10000);
        }
        
        // 初始化
        createStars();
        setInterval(createAsteroid, 3000);
        
        // 为按钮添加点击效果
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                // 添加点击动画
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
                
                // 如果是返回地球按钮
                if (this.classList.contains('btn-primary')) {
                    // 这里可以添加返回首页的逻辑
                    alert('正在返回地球...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    // 探索新星系功能
                    const galaxies = ['银河系', '仙女座星系', '大麦哲伦云', '小麦哲伦云', '三角座星系'];
                    const randomGalaxy = galaxies[Math.floor(Math.random() * galaxies.length)];
                    alert(`正在前往${randomGalaxy}...`);
                }
            });
        });
        
        // 添加页面加载动画
        window.addEventListener('load', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(50px)';
            container.style.transition = 'all 0.8s ease';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
