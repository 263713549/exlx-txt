<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLSX 转 TXT 工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input[type="number"]:focus,
        .form-group input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .file-upload {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .file-upload:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .file-upload.dragover {
            border-color: #667eea;
            background: #eef2ff;
        }
        
        .file-upload i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .file-upload-text {
            color: #666;
            font-size: 16px;
        }
        
        .file-upload-hint {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            color: #555;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .file-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        
        .file-item:last-child {
            margin-bottom: 0;
        }
        
        .file-name {
            font-size: 14px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 300px;
        }
        
        .file-remove {
            color: #dc3545;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
        
        .file-remove:hover {
            background: #ffebee;
            border-radius: 50%;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
        }
        
        .info-box p {
            color: #1565c0;
            font-size: 14px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 XLSX 转 TXT 工具</h1>
        
        <div class="info-box">
            <p>支持批量导入多个 Excel 文件，自定义导出行数，自动生成 TXT 文件。</p>
        </div>
        
        <form id="convertForm" enctype="multipart/form-data" action="/upload" method="post">
            <div class="form-group">
                <label>📁 选择文件（支持多文件）</label>
                <div class="file-upload" id="fileUpload">
                    <div style="font-size:48px;margin-bottom:15px;">📥</div>
                    <div class="file-upload-text">点击或拖拽文件到此处</div>
                    <div class="file-upload-hint">支持 .xlsx, .xls, .csv 格式</div>
                    <input type="file" id="fileInput" name="files" multiple accept=".xlsx,.xls,.csv" style="display:none;">
                </div>
                <div class="file-list" id="fileList" style="display:none;"></div>
            </div>
            
            <div class="form-group">
                <label>📝 每文件行数</label>
                <input type="number" name="chunk_size" id="chunk_size" value="1000" min="1" placeholder="每个TXT文件的行数">
            </div>
            
            <div class="form-group">
                <label>🏷️ 自定义文件名（可选）</label>
                <input type="text" name="custom_names" id="custom_names" placeholder="用逗号分隔，如：河北棋牌,辽宁棋牌,山东棋牌">
            </div>
            
            <div class="form-group">
                <label>⚙️ 高级选项</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" name="only_numbers" id="only_numbers">
                        <label for="only_numbers">只导出数字行</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="check_duplicates" id="check_duplicates">
                        <label for="check_duplicates">检测重复内容</label>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">🚀 开始转换</button>
        </form>
    </div>
    
    <script>
        const fileUpload = document.getElementById('fileUpload');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        const convertForm = document.getElementById('convertForm');
        
        const selectedFiles = [];
        
        // 点击上传区域
        fileUpload.addEventListener('click', () => {
            fileInput.click();
        });
        
        // 拖拽上传
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.classList.add('dragover');
        });
        
        fileUpload.addEventListener('dragleave', () => {
            fileUpload.classList.remove('dragover');
        });
        
        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        function handleFiles(files) {
            for (const file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (['xlsx', 'xls', 'csv'].includes(ext)) {
                    if (!selectedFiles.find(f => f.name === file.name)) {
                        selectedFiles.push(file);
                    }
                }
            }
            updateFileList();
        }
        
        function updateFileList() {
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                submitBtn.disabled = true;
                return;
            }
            
            fileList.style.display = 'block';
            submitBtn.disabled = false;
            fileList.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="file-name">${file.name}</span>
                    <span class="file-remove" onclick="removeFile(${index})">✕</span>
                `;
                fileList.appendChild(item);
            });
        }
        
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }
        
        // 表单提交前准备
        convertForm.addEventListener('submit', (e) => {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => {
                dataTransfer.items.add(file);
            });
            fileInput.files = dataTransfer.files;
        });
    </script>
</body>
</html>
